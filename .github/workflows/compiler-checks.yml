name: Compiler offline checks

on:
  push:
    paths:
      - 'tools/build_mod*.ps1'
      - 'tools/tests/build_mod_regression.ps1'
      - '.github/workflows/compiler-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check isolated logic on Windows PowerShell 5.1
        shell: powershell
        run: ./tools/tests/build_mod_regression.ps1
      - name: Check isolated logic on PowerShell 7
        shell: pwsh
        run: ./tools/tests/build_mod_regression.ps1
