name: TopBar Mod Updater

on:
  schedule:
    - cron: '39 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download vanilla CSS and rebuild XML override
        shell: pwsh
        run: |
          $stylesBaseURL = "https://raw.githubusercontent.com/SteamTracking/GameTracking-Deadlock/master/game/citadel/pak01_dir/panorama/styles"
          $layoutBaseURL = "https://raw.githubusercontent.com/SteamTracking/GameTracking-Deadlock/master/game/citadel/pak01_dir/panorama/layout"
          $modNames = @(
            "Show-Nicknames-In-TopBar",
            "Show-Nicknames-In-TopBar-No-Offsets"
          )
          foreach ($modName in $modNames) {
              $baseCssPath = "$modName/panorama/styles/base/citadel_hud_top_bar.css"
              New-Item -ItemType Directory -Force -Path "$modName/panorama/styles/base" | Out-Null
              Invoke-WebRequest -Uri "$stylesBaseURL/citadel_hud_top_bar.css" -OutFile $baseCssPath
          }

          $xml = (Invoke-WebRequest -Uri "$layoutBaseURL/citadel_hud_top_bar_player.xml").Content

          if ($xml.Contains('AlwaysPlayerName')) {
              Write-Host "AlwaysPlayerName label already present in generated XML."
          } else {
              $anchor = '<Panel id="PlayerNameNWContainer" onmouseover="CitadelTopDownScoreboardPlayerHovered();">'
              $anchorIndex = $xml.IndexOf($anchor)

              if ($anchorIndex -lt 0) {
                  throw "Could not find PlayerNameNWContainer anchor while rebuilding top bar XML override."
              }

              $lineStart = $xml.LastIndexOf("`n", $anchorIndex)
              if ($lineStart -lt 0) {
                  $lineStart = 0
              } else {
                  $lineStart += 1
              }

              $linePrefix = $xml.Substring($lineStart, $anchorIndex - $lineStart)
              $indent = ($linePrefix -replace '[^\s].*$', '')
              $labelLine = $indent + '<Label class="AlwaysPlayerName" text="{s:player_name}" />' + "`r`n`r`n"
              $xml = $xml.Insert($anchorIndex, $labelLine)
          }
          foreach ($modName in $modNames) {
              $overrideXmlPath = "$modName/panorama/layout/citadel_hud_top_bar_player.xml"
              New-Item -ItemType Directory -Force -Path "$modName/panorama/layout" | Out-Null
              [System.IO.File]::WriteAllText((Resolve-Path ".").Path + "\" + $overrideXmlPath, $xml, (New-Object System.Text.UTF8Encoding $false))
          }

      - name: Commit changes
        id: git_check
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Show-Nicknames-In-TopBar/panorama/styles/base/citadel_hud_top_bar.css
          git add Show-Nicknames-In-TopBar/panorama/layout/citadel_hud_top_bar_player.xml
          git add Show-Nicknames-In-TopBar-No-Offsets/panorama/styles/base/citadel_hud_top_bar.css
          git add Show-Nicknames-In-TopBar-No-Offsets/panorama/layout/citadel_hud_top_bar_player.xml

          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git commit -m "chore: auto-update topbar base panorama files"
            git pull --rebase origin main
            git push
          fi

      # Cache the 2.4 GB CSDK zip so we only pull it from Drive once.
      # Bump the key (csdk-zip-v2, ...) whenever the CSDK contents change.
      - name: Cache CSDK
        id: cache-csdk
        if: steps.git_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: csdk.zip
          key: csdk-zip-v1

      - name: Download CSDK
        if: (steps.git_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && steps.cache-csdk.outputs.cache-hit != 'true'
        shell: bash
        run: curl -L "${{ secrets.CSDK_DRIVE_URL }}" -o csdk.zip

      - name: Extract CSDK
        if: steps.git_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: 7z x csdk.zip -oC:/ -y

      - name: Compile and Pack VPK
        if: steps.git_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ModNames = @(
            "Show-Nicknames-In-TopBar",
            "Show-Nicknames-In-TopBar-No-Offsets"
          )
          $CsdkRoot = "C:\Reduced_CSDK_12"

          if (-not (Test-Path "$CsdkRoot\game\bin_cs2\win64\resourcecompiler.exe")) {
              if (Test-Path "$CsdkRoot\Reduced_CSDK_12\game\bin_cs2\win64\resourcecompiler.exe") {
                  $CsdkRoot = "$CsdkRoot\Reduced_CSDK_12"
              }
          }

          $Compiler = "$CsdkRoot\game\bin_cs2\win64\resourcecompiler.exe"
          $Packer = "$CsdkRoot\game\bin\win64\CSDKCfgVPK.exe"

          New-Item -ItemType Directory -Force -Path "builds" | Out-Null
          foreach ($ModName in $ModNames) {
              $ContentDir = "$CsdkRoot\content\citadel_addons\build_$ModName"
              $GameDir = "$CsdkRoot\game\citadel_addons\build_$ModName"

              New-Item -ItemType Directory -Force -Path $ContentDir | Out-Null
              Copy-Item -Path "$ModName\*" -Destination $ContentDir -Recurse -Force

              $Files = Get-ChildItem -Path $ContentDir -Recurse -File | Where-Object { $_.Extension -in @('.css', '.xml', '.js') }
              foreach ($f in $Files) {
                  & $Compiler -i $f.FullName -nop4 2>&1 | Out-Null
              }

              $OutVpk = "$PWD\builds\$ModName.vpk"
              $PackerDir = Split-Path $Packer
              $Proc = Start-Process -FilePath $Packer -ArgumentList "`"$GameDir`"", "`"$OutVpk`"" -WorkingDirectory $PackerDir -PassThru

              try {
                  $Proc | Wait-Process -Timeout 30 -ErrorAction Stop
              } catch {
                  $Proc | Stop-Process -Force -ErrorAction SilentlyContinue
              }

              if (-not (Test-Path $OutVpk)) {
                  Write-Error "VPK file was not found at $OutVpk"
                  exit 1
              }
          }
          exit 0

      - name: Zip VPK for upload
        if: steps.git_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ModNames = @(
            "Show-Nicknames-In-TopBar",
            "Show-Nicknames-In-TopBar-No-Offsets"
          )
          $Version = (Get-Date -Format "yyyy.MM.dd")
          foreach ($ModName in $ModNames) {
              $ZipPath = "builds\$ModName.zip"
              Compress-Archive -Path "builds\$ModName.vpk" -DestinationPath $ZipPath -Force
          }
          # Export version for downstream steps
          echo "MOD_VERSION=$Version" >> $env:GITHUB_ENV
          echo "MOD_ZIP_WITH_OFFSETS=builds\Show-Nicknames-In-TopBar.zip" >> $env:GITHUB_ENV
          echo "MOD_ZIP_NO_OFFSETS=builds\Show-Nicknames-In-TopBar-No-Offsets.zip" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        if: steps.git_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            builds/Show-Nicknames-In-TopBar.zip
            builds/Show-Nicknames-In-TopBar-No-Offsets.zip
          tag_name: "v${{ github.run_number }}"
          name: "Show Nicknames In Top Bar v${{ env.MOD_VERSION }}"

      - name: Set up Python
        if: steps.git_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uploader dependencies
        if: steps.git_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: pip install requests beautifulsoup4

      - name: Upload to GameBanana
        if: steps.git_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GB_USERNAME: ${{ secrets.GB_USERNAME }}
          GB_PASSWORD: ${{ secrets.GB_PASSWORD }}
        run: python tools/gb_upload.py "${{ env.MOD_ZIP_WITH_OFFSETS }}" "${{ env.MOD_ZIP_NO_OFFSETS }}" "${{ env.MOD_VERSION }}"
