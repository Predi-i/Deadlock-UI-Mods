name: Mod Updater

on:
  repository_dispatch:
    types: [game-update, auto-update]
  schedule:
    - cron: '39 2 * * *'
  workflow_dispatch:

concurrency:
  group: mod-updater
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout GameTracking
        uses: actions/checkout@v4
        with:
          repository: SteamTracking/GameTracking-Deadlock
          path: upstream
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            game/citadel/pak01_dir/panorama
            game/core/pak01_dir/panorama/layout

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update native overrides
        shell: pwsh
        run: |
          python tools/update_mods.py --game-root upstream
          if ($LASTEXITCODE -ne 0) { throw "Native override update failed" }
          python tools/sync_hud_lookup.py
          if ($LASTEXITCODE -ne 0) { throw "HUD helper sync failed" }

      - name: Validate source updates
        shell: pwsh
        run: |
          pip install requests beautifulsoup4
          if ($LASTEXITCODE -ne 0) { throw "Test dependency installation failed" }
          python -m unittest discover -s tools/tests -v
          if ($LASTEXITCODE -ne 0) { throw "Updater regression tests failed" }
          node tools/tests/runtime_regressions.cjs
          if ($LASTEXITCODE -ne 0) { throw "HUD runtime regression tests failed" }
          node --test HUD-Dumper/tests/hud_dumper.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "HUD dumper regression tests failed" }
          foreach ($Flag in @("", "--delayed-layout", "--old-layout", "--modern-layout", "--wrapped-effects")) {
              if ($Flag) { node Djinn-Mark-In-TopBar/tests/djinn_mark.test.cjs $Flag }
              else { node Djinn-Mark-In-TopBar/tests/djinn_mark.test.cjs }
              if ($LASTEXITCODE -ne 0) { throw "Djinn regression tests failed" }
          }

      - name: Commit source updates and select builds
        id: git_check
        shell: pwsh
        run: |
          git config user.name "Predi-i"
          git config user.email "Predi-i@users.noreply.github.com"
          git add -- tools/upstream.json
          Get-ChildItem -Directory | Where-Object { Test-Path "$($_.FullName)/panorama" } | ForEach-Object { git add -- $_.Name }
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 1) {
              git commit -m "chore: update native panorama overrides"
              if ($LASTEXITCODE -ne 0) { throw "Source commit failed" }
              git push
              if ($LASTEXITCODE -ne 0) { throw "Source push failed" }
          } elseif ($LASTEXITCODE -ne 0) { throw "Git diff failed" }
          python tools/select_mod_builds.py --output builds/selection.json --all="${{ github.event_name == 'workflow_dispatch' }}"
          if ($LASTEXITCODE -ne 0) { throw "Build selection failed" }
          $Selection = Get-Content builds/selection.json -Raw | ConvertFrom-Json
          "changed=$($Selection.mods.Count -gt 0)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          "nicknames=$($Selection.nicknames)".ToLowerInvariant() >> $env:GITHUB_OUTPUT

      # Cache the 2.4 GB CSDK zip so we only pull it from Drive once.
      # Bump the key (csdk-zip-v2, ...) whenever the CSDK contents change.
      - name: Cache CSDK
        id: cache-csdk
        if: steps.git_check.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: csdk.zip
          key: csdk-zip-v1

      - name: Download CSDK
        if: (steps.git_check.outputs.changed == 'true') && steps.cache-csdk.outputs.cache-hit != 'true'
        shell: bash
        run: curl -L "${{ secrets.CSDK_DRIVE_URL }}" -o csdk.zip

      - name: Extract CSDK
        if: steps.git_check.outputs.changed == 'true'
        shell: bash
        run: 7z x csdk.zip -oC:/ -y

      - name: Compile and Pack VPK
        if: steps.git_check.outputs.changed == 'true'
        shell: pwsh
        run: |
          $ModNames = (Get-Content builds/selection.json -Raw | ConvertFrom-Json).mods
          $CsdkRoot = "C:\Reduced_CSDK_12"

          if (-not (Test-Path "$CsdkRoot\game\bin_cs2\win64\resourcecompiler.exe")) {
              if (Test-Path "$CsdkRoot\Reduced_CSDK_12\game\bin_cs2\win64\resourcecompiler.exe") {
                  $CsdkRoot = "$CsdkRoot\Reduced_CSDK_12"
              }
          }

          $Compiler = "$CsdkRoot\game\bin_cs2\win64\resourcecompiler.exe"
          $Packer = "$CsdkRoot\game\bin\win64\CSDKCfgVPK.exe"

          New-Item -ItemType Directory -Force -Path "builds" | Out-Null
          foreach ($ModName in $ModNames) {
              $ContentDir = "$CsdkRoot\content\citadel_addons\build_$ModName"
              $GameDir = "$CsdkRoot\game\citadel_addons\build_$ModName"

              New-Item -ItemType Directory -Force -Path $ContentDir | Out-Null
              Copy-Item -Path "$ModName\panorama" -Destination $ContentDir -Recurse -Force
              python tools/prepare_ci_assets.py --content $ContentDir --game $GameDir
              if ($LASTEXITCODE -ne 0) { throw "Asset preparation failed: $ModName" }

              $Outputs = @{
                  '.css' = '.vcss_c'; '.xml' = '.vxml_c'; '.js' = '.vjs_c'
                  '.svg' = '.vsvg_c'; '.vsvg' = '.vsvg_c'; '.vtex' = '.vtex_c'
                  '.vsndevts' = '.vsndevts_c'; '.wav' = '.vsnd_c'
                  '.vpcf' = '.vpcf_c'; '.vmdl' = '.vmdl_c'; '.vmat' = '.vmat_c'
              }
              $Files = Get-ChildItem -Path $ContentDir -Recurse -File | Where-Object { $_.Extension -in @('.css', '.xml', '.js', '.svg', '.vsvg', '.vtex', '.vsndevts', '.wav', '.vpcf', '.vmdl', '.vmat') }
              foreach ($f in $Files) {
                  & $Compiler -i $f.FullName -nop4
                  if ($LASTEXITCODE -ne 0) { throw "Compilation failed: $($f.FullName)" }
                  $Relative = $f.FullName.Substring($ContentDir.Length + 1)
                  $Compiled = Join-Path $GameDir ([System.IO.Path]::ChangeExtension($Relative, $Outputs[$f.Extension]))
                  if (-not (Test-Path -LiteralPath $Compiled)) { throw "Compiled output missing: $Compiled" }
              }

              $OutVpk = "$PWD\builds\$ModName.vpk"
              $PackerDir = Split-Path $Packer
              $Proc = Start-Process -FilePath $Packer -ArgumentList "`"$GameDir`"", "`"$OutVpk`"" -WorkingDirectory $PackerDir -WindowStyle Hidden -PassThru

              try {
                  $Proc | Wait-Process -Timeout 120 -ErrorAction Stop
              } catch {
                  $Proc | Stop-Process -Force -ErrorAction SilentlyContinue
                  throw "VPK packing timed out: $ModName"
              }

              if ($Proc.ExitCode -ne 0 -or -not (Test-Path $OutVpk)) {
                  Write-Error "VPK file was not found at $OutVpk"
                  exit 1
              }
          }
          exit 0

      - name: Zip VPK for upload
        if: steps.git_check.outputs.changed == 'true'
        shell: pwsh
        run: |
          $ModNames = (Get-Content builds/selection.json -Raw | ConvertFrom-Json).mods
          $Version = (Get-Date -Format "yyyy.MM.dd")
          foreach ($ModName in $ModNames) {
              $ZipPath = "builds\$ModName.zip"
              Compress-Archive -Path "builds\$ModName.vpk" -DestinationPath $ZipPath -Force
          }
          # Export version for downstream steps
          echo "MOD_VERSION=$Version" >> $env:GITHUB_ENV
          echo "MOD_ZIP_WITH_OFFSETS=builds\Show-Nicknames-In-TopBar.zip" >> $env:GITHUB_ENV
          echo "MOD_ZIP_NO_OFFSETS=builds\Show-Nicknames-In-TopBar-No-Offsets.zip" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        if: steps.git_check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: builds/*.zip
          fail_on_unmatched_files: true
          tag_name: "v${{ github.run_number }}"
          name: "Deadlock UI Mods ${{ env.MOD_VERSION }}"
          target_commitish: main

      - name: Install uploader dependencies
        if: steps.git_check.outputs.nicknames == 'true'
        shell: bash
        run: pip install requests beautifulsoup4

      - name: Upload to GameBanana
        if: steps.git_check.outputs.nicknames == 'true'
        shell: bash
        env:
          GB_USERNAME: ${{ secrets.GB_USERNAME }}
          GB_PASSWORD: ${{ secrets.GB_PASSWORD }}
        run: python tools/gb_upload.py "${{ env.MOD_ZIP_WITH_OFFSETS }}" "${{ env.MOD_ZIP_NO_OFFSETS }}" "${{ env.MOD_VERSION }}"

      - name: Record published source hashes
        if: steps.git_check.outputs.changed == 'true'
        shell: pwsh
        run: |
          Copy-Item -LiteralPath builds/selection.json -Destination .github/mod-build-state.json
          git add .github/mod-build-state.json
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 1) {
              git commit -m "chore: record published mod source hashes"
              if ($LASTEXITCODE -ne 0) { throw "Build state commit failed" }
              git push
              if ($LASTEXITCODE -ne 0) { throw "Build state push failed" }
          } elseif ($LASTEXITCODE -ne 0) { throw "Git diff failed" }
