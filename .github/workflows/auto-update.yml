name: TopBar Mod Updater

on:
  schedule:
    - cron: '39 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download vanilla CSS and rebuild XML override
        shell: pwsh
        run: |
          $stylesBaseURL = "https://raw.githubusercontent.com/SteamTracking/GameTracking-Deadlock/master/game/citadel/pak01_dir/panorama/styles"
          $layoutBaseURL = "https://raw.githubusercontent.com/SteamTracking/GameTracking-Deadlock/master/game/citadel/pak01_dir/panorama/layout"
          $baseCssPath = "Show-Nicknames-In-TopBar/panorama/styles/base/citadel_hud_top_bar.css"
          $overrideXmlPath = "Show-Nicknames-In-TopBar/panorama/layout/citadel_hud_top_bar_player.xml"
          
          New-Item -ItemType Directory -Force -Path "Show-Nicknames-In-TopBar/panorama/styles/base" | Out-Null
          New-Item -ItemType Directory -Force -Path "Show-Nicknames-In-TopBar/panorama/layout" | Out-Null
          
          Invoke-WebRequest -Uri "$stylesBaseURL/citadel_hud_top_bar.css" -OutFile $baseCssPath
          
          $xml = Invoke-RestMethod -Uri "$layoutBaseURL/citadel_hud_top_bar_player.xml"
          
          if ($xml.Contains('AlwaysPlayerName')) {
              Write-Host "AlwaysPlayerName label already present in generated XML."
          } else {
              $anchor = '<Panel id="PlayerNameNWContainer" onmouseover="CitadelTopDownScoreboardPlayerHovered();">'
              $anchorIndex = $xml.IndexOf($anchor)

              if ($anchorIndex -lt 0) {
                  throw "Could not find PlayerNameNWContainer anchor while rebuilding top bar XML override."
              }

              $lineStart = $xml.LastIndexOf("`n", $anchorIndex)
              if ($lineStart -lt 0) {
                  $lineStart = 0
              } else {
                  $lineStart += 1
              }

              $linePrefix = $xml.Substring($lineStart, $anchorIndex - $lineStart)
              $indent = ($linePrefix -replace '[^\s].*$', '')
              $labelLine = $indent + '<Label class="AlwaysPlayerName" text="{s:player_name}" />' + "`r`n`r`n"
              $xml = $xml.Insert($anchorIndex, $labelLine)
          }
          [System.IO.File]::WriteAllText((Resolve-Path ".").Path + "\" + $overrideXmlPath, $xml, (New-Object System.Text.UTF8Encoding $false))

      - name: Commit changes
        id: git_check
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Show-Nicknames-In-TopBar/panorama/styles/base/citadel_hud_top_bar.css
          git add Show-Nicknames-In-TopBar/panorama/layout/citadel_hud_top_bar_player.xml
          
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git commit -m "chore: auto-update topbar base panorama files"
            git pull --rebase origin main
            git push
          fi

      - name: Download CSDK
        if: steps.git_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: curl -L "${{ secrets.CSDK_DRIVE_URL }}" -o csdk.zip

      - name: Extract CSDK
        if: steps.git_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: 7z x csdk.zip -oC:/ -y

      - name: Compile and Pack VPK
        if: steps.git_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ModName = "Show-Nicknames-In-TopBar"
          $CsdkRoot = "C:\Reduced_CSDK_12"
          
          if (-not (Test-Path "$CsdkRoot\game\bin_cs2\win64\resourcecompiler.exe")) {
              if (Test-Path "$CsdkRoot\Reduced_CSDK_12\game\bin_cs2\win64\resourcecompiler.exe") {
                  $CsdkRoot = "$CsdkRoot\Reduced_CSDK_12"
              }
          }

          $Compiler = "$CsdkRoot\game\bin_cs2\win64\resourcecompiler.exe"
          $Packer = "$CsdkRoot\game\bin\win64\CSDKCfgVPK.exe"

          $ContentDir = "$CsdkRoot\content\citadel_addons\build_$ModName"
          $GameDir = "$CsdkRoot\game\citadel_addons\build_$ModName"

          New-Item -ItemType Directory -Force -Path $ContentDir | Out-Null
          Copy-Item -Path "$ModName\*" -Destination $ContentDir -Recurse -Force

          $Files = Get-ChildItem -Path $ContentDir -Recurse -File | Where-Object { $_.Extension -in @('.css', '.xml', '.js') }
          foreach ($f in $Files) {
              & $Compiler -i $f.FullName -nop4 2>&1 | Out-Null
          }

          New-Item -ItemType Directory -Force -Path "builds" | Out-Null
          $OutVpk = "$PWD\builds\$ModName.vpk"
          
          $PackerDir = Split-Path $Packer
          $Proc = Start-Process -FilePath $Packer -ArgumentList "`"$GameDir`"", "`"$OutVpk`"" -WorkingDirectory $PackerDir -PassThru
          
          try {
              $Proc | Wait-Process -Timeout 30 -ErrorAction Stop
          } catch {
              $Proc | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          
          if (-not (Test-Path $OutVpk)) {
              Write-Error "VPK file was not found at $OutVpk"
              exit 1
          }
          exit 0

      - name: Create GitHub Release
        if: steps.git_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: builds/Show-Nicknames-In-TopBar.vpk
          tag_name: "v${{ github.run_number }}"
          name: "Show Nicknames In Top Bar"