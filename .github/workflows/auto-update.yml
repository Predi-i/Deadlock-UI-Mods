name: Auto-Update TopBar Mod

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download vanilla CSS
        shell: pwsh
        run: |
          $baseURL = "https://raw.githubusercontent.com/SteamTracking/GameTracking-Deadlock/master/game/citadel/pak01_dir/panorama/styles"
          New-Item -ItemType Directory -Force -Path "Show-Nicknames-In-TopBar/panorama/styles/base"
          Invoke-WebRequest -Uri "$baseURL/citadel_hud_top_bar.css" -OutFile "Show-Nicknames-In-TopBar/panorama/styles/base/citadel_hud_top_bar.css"

      - name: Commit changes
        id: git_check
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Show-Nicknames-In-TopBar/panorama/styles/base/citadel_hud_top_bar.css
          
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git commit -m "Auto-update base CSS"
            git pull --rebase origin main
            git push
          fi

      - name: Download CSDK
        if: steps.git_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: curl -L "${{ secrets.CSDK_DRIVE_URL }}" -o csdk.zip

      - name: Extract CSDK
        if: steps.git_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "File size:"
          ls -lh csdk.zip
          echo "Unpacking..."
          7z x csdk.zip -oC:/ -y

      - name: Compile and Pack VPK (Headless Hack)
        if: steps.git_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ModName = "Show-Nicknames-In-TopBar"
          $Csdk = "C:\Reduced_CSDK_12"
          $ContentDir = "$Csdk\content\citadel_addons\build_$ModName"
          $GameDir = "$Csdk\game\citadel_addons\build_$ModName"

          New-Item -ItemType Directory -Force -Path $ContentDir | Out-Null
          Copy-Item -Path "$ModName\*" -Destination $ContentDir -Recurse -Force

          $Compiler = "$Csdk\game\bin_cs2\win64\resourcecompiler.exe"
          $Files = Get-ChildItem -Path $ContentDir -Recurse -File | Where-Object { $_.Extension -in @('.css', '.xml', '.js') }
          foreach ($f in $Files) {
              & $Compiler -i $f.FullName -nop4
          }

          New-Item -ItemType Directory -Force -Path "builds" | Out-Null
          $Packer = "$Csdk\game\bin\win64\CSDKCfgVPK.exe"
          $OutVpk = "$PWD\builds\$ModName.vpk"
          
          Write-Host "Running Packer..."
          Start-Process -FilePath $Packer -ArgumentList "`"$GameDir`"", "`"$OutVpk`""
          
          Start-Sleep -Seconds 4
          
          Stop-Process -Name "CSDKCfgVPK" -Force -ErrorAction SilentlyContinue
          Write-Host "VPK is packed."

      - name: Create GitHub Release
        if: steps.git_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: builds/Show-Nicknames-In-TopBar.vpk
          tag_name: "v${{ github.run_number }}"
          name: "Auto-Update: Show Nicknames In Top Bar"