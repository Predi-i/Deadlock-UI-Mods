name: Review native mod updates

on:
  repository_dispatch:
    types: [game-update, auto-update]
  schedule:
    - cron: '39 * * * *'
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: GameTracking commit (empty selects latest)
        type: string
      dry_run:
        description: Preview without creating a PR or notifying Discord
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ui-mods-native-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: SteamTracking/GameTracking-Deadlock
          path: upstream
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            game/citadel/pak01_dir/panorama
            game/core/pak01_dir/panorama/layout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare source proposals for all tracked mods
        env:
          UPSTREAM_SHA: ${{ github.event.client_payload.sha || inputs.upstream_sha }}
        run: |
          python tools/update_mods.py --game-root upstream --revision "${UPSTREAM_SHA:-HEAD}" --allow-partial
      - name: Keep compatibility review
        uses: actions/upload-artifact@v4
        with:
          name: native-update-report
          path: |
            .upstream-review/report.md
            .upstream-review/summary.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Verify source changes
        run: |
          pip install requests beautifulsoup4
          python tools/run_source_checks.py
      - name: Maintain one review PR
        id: review
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          args=()
          if [[ "$DRY_RUN" == 'true' ]]; then args+=(--dry-run); fi
          python tools/prepare_native_review.py "${args[@]}"
      - name: Notify UI Mods developer channel
        id: notify
        if: steps.review.outputs.pr_url != '' && steps.review.outputs.notified != 'true' && inputs.dry_run != true
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_UI_MODS_WEBHOOK_URL }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_UI_MODS_CHANNEL_ID }}
          DISCORD_ROLE_ID: ${{ vars.DISCORD_UI_MODS_ROLE_ID }}
        run: python tools/notify_mod_updates.py
      - name: Acknowledge delivered notification
        if: steps.notify.outputs.sent == 'true'
        run: python tools/prepare_native_review.py --acknowledge
